[workspace]
members = [".", "tools/vyvrael-data", "tools/vyvrael-train"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Nexxus Drako Multimedia"]
repository = "https://github.com/NexxusDrakoMultimedia/Vyvrael-Chess"

[package]
name = "vyvrael"
description = "A dragon-flavoured UCI chess engine in Rust, built with AI and playing for the attack."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

# The engine crate deliberately has no dependencies. See docs/DEPENDENCIES.md
# before adding one, and never depend on the tool crates from here.
[dependencies]

[features]
# Sliding-piece attacks by the PEXT instruction (BMI2) instead of magic
# multiplication. Only for x86-64 targets built with BMI2, for example
# RUSTFLAGS="-C target-cpu=x86-64-v3". Fast on Intel from Haswell and AMD
# from Zen 3, slow on older AMD processors. See docs/ARCHITECTURE.md.
pext = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
