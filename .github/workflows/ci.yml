name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup show no longer installs a missing toolchain, so install the
      # version rust-toolchain.toml pins first.
      - name: Install and show toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release
      # Offline tests of the helper scripts: nothing is downloaded or installed.
      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests
