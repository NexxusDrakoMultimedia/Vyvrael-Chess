name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs stable with rustfmt
      # and clippy on first use.
      - name: Show toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release
      # Offline tests of the helper scripts: nothing is downloaded or installed.
      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests
